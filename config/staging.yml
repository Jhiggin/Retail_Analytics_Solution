# Staging Environment Configuration

# Databricks workspace
databricks_host_staging: "https://your-workspace-staging.cloud.databricks.com"

# Unity Catalog
catalog_name: "retail_analytics_staging"
schema_name: "analytics"

# Service Principal
service_principal_staging: "sp-databricks-staging@yourdomain.com"

# Notification settings
notification_email: "data-team@example.com"

# Data paths
raw_data_path: "/mnt/staging/raw_data"
checkpoint_path: "/mnt/staging/checkpoints"

# Job configuration
job_timeout: 3600  # 1 hour
max_retries: 2
