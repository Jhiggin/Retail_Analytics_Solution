# Databricks Asset Bundle Configuration
# This is the main configuration file for your Databricks Asset Bundle

bundle:
  name: retail_analytics_solution

# Include additional configuration files
include:
  - resources/*.yml

# Workspace configuration
workspace:
  # The root path in the Databricks workspace where bundle resources are deployed
  root_path: "~/.bundle/${bundle.name}/${bundle.target}"

# Artifact configuration for uploading files
artifacts:
  default:
    type: whl
    build: poetry build
    path: .

# Targets define different deployment environments
targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: ${var.databricks_host_dev}
      root_path: "~/.bundle/${bundle.name}/dev"
    resources:
      jobs:
        # Add _dev suffix to all jobs in dev
        "*":
          name: "${bundle.name}_${bundle.target}_*"
          tags:
            environment: dev
      pipelines:
        "*":
          name: "${bundle.name}_${bundle.target}_*"
          development: true

  # Staging environment
  staging:
    mode: production
    workspace:
      host: ${var.databricks_host_staging}
      root_path: /Shared/.bundle/${bundle.name}/staging
    resources:
      jobs:
        "*":
          name: "${bundle.name}_staging_*"
          tags:
            environment: staging
          schedule:
            quartz_cron_expression: "0 0 3 * * ?"
            timezone_id: "America/New_York"
      pipelines:
        "*":
          name: "${bundle.name}_staging_*"
          development: false
    run_as:
      service_principal_name: ${var.service_principal_staging}

  # Production environment
  prod:
    mode: production
    workspace:
      host: ${var.databricks_host_prod}
      root_path: /Shared/.bundle/${bundle.name}/prod
    resources:
      jobs:
        "*":
          name: "${bundle.name}_prod_*"
          tags:
            environment: prod
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: "America/New_York"
          max_concurrent_runs: 1
      pipelines:
        "*":
          name: "${bundle.name}_prod_*"
          development: false
    run_as:
      service_principal_name: ${var.service_principal_prod}

# Variables that can be referenced throughout the bundle
variables:
  databricks_host_dev:
    description: "Databricks workspace URL for dev"
  databricks_host_staging:
    description: "Databricks workspace URL for staging"
  databricks_host_prod:
    description: "Databricks workspace URL for prod"
  service_principal_staging:
    description: "Service principal for staging deployments"
  service_principal_prod:
    description: "Service principal for production deployments"
  catalog_name:
    description: "Unity Catalog name"
    default: "retail_analytics"
  schema_name:
    description: "Schema name in Unity Catalog"
    default: "analytics"
