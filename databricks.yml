# This is a Databricks asset bundle definition for Retail_Analytics_Solution.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Retail_Analytics_Solution
  uuid: d89afecf-3795-49fe-877a-f147ba20d9dd

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-4220674337023826.6.azuredatabricks.net
    variables:
      catalog: retail_dev
      schema: retail_analytics
  prod:
    mode: production
    workspace:
      host: https://adb-4220674337023826.6.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/joshua.higginbotham@codenamesql.com to make sure we only have a single copy.
      root_path: /Workspace/Users/joshua.higginbotham@codenamesql.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_prod
      schema: retail_analytics
    permissions:
      - user_name: joshua.higginbotham@codenamesql.com
        level: CAN_MANAGE
