# Master Orchestration Job - Runs complete medallion architecture
# Bronze → Silver → Gold pipeline sequence
resources:
  jobs:
    retail_analytics_orchestration:
      name: retail_analytics_orchestration
      description: "Master job orchestrating Bronze → Silver → Gold pipeline"

      # Daily schedule in production, paused in development
      trigger:
        periodic:
          interval: 1
          unit: DAYS

      # Email notifications on failure (optional)
      # email_notifications:
      #   on_failure:
      #     - your_email@example.com

      tasks:
        # ===== BRONZE LAYER TASKS =====
        - task_key: bronze_sales
          description: "Ingest raw sales data from ADLS"
          job_task:
            job_id: ${resources.jobs.bronze_sales.id}

        - task_key: bronze_products
          description: "Ingest raw products data from ADLS"
          job_task:
            job_id: ${resources.jobs.bronze_products.id}

        - task_key: bronze_stores
          description: "Ingest raw stores data from ADLS"
          job_task:
            job_id: ${resources.jobs.bronze_stores.id}

        - task_key: bronze_promotions
          description: "Ingest raw promotions data from ADLS"
          job_task:
            job_id: ${resources.jobs.bronze_promotions.id}

        # ===== SILVER LAYER TASKS (depend on bronze completion) =====
        - task_key: silver_sales
          description: "Validate and clean sales data"
          depends_on:
            - task_key: bronze_sales
            - task_key: bronze_products
            - task_key: bronze_stores
            - task_key: bronze_promotions
          job_task:
            job_id: ${resources.jobs.silver_sales.id}

        - task_key: silver_products
          description: "Validate and clean products data"
          depends_on:
            - task_key: bronze_products
          job_task:
            job_id: ${resources.jobs.silver_products.id}

        - task_key: silver_stores
          description: "Validate and clean stores data"
          depends_on:
            - task_key: bronze_stores
          job_task:
            job_id: ${resources.jobs.silver_stores.id}

        - task_key: silver_promotions
          description: "Validate and clean promotions data"
          depends_on:
            - task_key: bronze_promotions
          job_task:
            job_id: ${resources.jobs.silver_promotions.id}

        # ===== GOLD LAYER DIMENSION TASKS (depend on silver) =====
        - task_key: gold_dim_date
          description: "Build date dimension"
          depends_on:
            - task_key: silver_sales
          job_task:
            job_id: ${resources.jobs.gold_dim_date.id}

        - task_key: gold_dim_product
          description: "Build product dimension"
          depends_on:
            - task_key: silver_products
          job_task:
            job_id: ${resources.jobs.gold_dim_product.id}

        - task_key: gold_dim_store
          description: "Build store dimension"
          depends_on:
            - task_key: silver_stores
          job_task:
            job_id: ${resources.jobs.gold_dim_store.id}

        - task_key: gold_dim_promotion
          description: "Build promotion dimension"
          depends_on:
            - task_key: silver_promotions
          job_task:
            job_id: ${resources.jobs.gold_dim_promotion.id}

        # ===== GOLD LAYER FACT AND VIEWS (depend on dimensions) =====
        - task_key: gold_fact_sales
          description: "Build sales fact table with dimension keys"
          depends_on:
            - task_key: gold_dim_date
            - task_key: gold_dim_product
            - task_key: gold_dim_store
            - task_key: gold_dim_promotion
          job_task:
            job_id: ${resources.jobs.gold_fact_sales.id}

        - task_key: gold_analytics_views
          description: "Build analytics views using star schema"
          depends_on:
            - task_key: gold_fact_sales
          job_task:
            job_id: ${resources.jobs.gold_analytics_views.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
