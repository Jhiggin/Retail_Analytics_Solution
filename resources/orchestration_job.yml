# Orchestration Job - Notebook-based orchestration
# Runs notebooks with optimal parallelization:
# Bronze layer (parallel) → Silver layer (parallel) → Gold dimensions (parallel) → Fact table → Analytics views
resources:
  jobs:
    retail_analytics_orchestration:
      name: retail_analytics_orchestration
      description: "Master orchestration job: Bronze → Silver → Gold with parallel execution"

      # Daily schedule in production, paused in development
      trigger:
        periodic:
          interval: 1
          unit: DAYS

      tasks:
        # Bronze Layer Tasks (Ingest raw data - ALL RUN IN PARALLEL)
        - task_key: bronze_sales
          description: "Bronze Layer - Ingest Sales data from ADLS"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/01_bronze_sales
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: bronze_products
          description: "Bronze Layer - Ingest Products data from ADLS"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_bronze_products
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: bronze_stores
          description: "Bronze Layer - Ingest Stores data from ADLS"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_bronze_stores
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: bronze_promotions
          description: "Bronze Layer - Ingest Promotions data from ADLS"
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/04_bronze_promotions
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Silver Layer Tasks (Validate and clean data - ALL RUN IN PARALLEL after Bronze)
        - task_key: silver_sales
          description: "Silver Layer - Validate and clean Sales data"
          depends_on:
            - task_key: bronze_sales
            - task_key: bronze_products
            - task_key: bronze_stores
            - task_key: bronze_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/05_silver_sales
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_products
          description: "Silver Layer - Validate and clean Products data"
          depends_on:
            - task_key: bronze_sales
            - task_key: bronze_products
            - task_key: bronze_stores
            - task_key: bronze_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/06_silver_products
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_stores
          description: "Silver Layer - Validate and clean Stores data"
          depends_on:
            - task_key: bronze_sales
            - task_key: bronze_products
            - task_key: bronze_stores
            - task_key: bronze_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/07_silver_stores
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: silver_promotions
          description: "Silver Layer - Validate and clean Promotions data"
          depends_on:
            - task_key: bronze_sales
            - task_key: bronze_products
            - task_key: bronze_stores
            - task_key: bronze_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/08_silver_promotions
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Gold Layer Dimensions (ALL RUN IN PARALLEL after Silver)
        - task_key: gold_dim_date
          description: "Gold Layer - Build Date Dimension"
          depends_on:
            - task_key: silver_sales
            - task_key: silver_products
            - task_key: silver_stores
            - task_key: silver_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/09_gold_dim_date
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_dim_product
          description: "Gold Layer - Build Product Dimension"
          depends_on:
            - task_key: silver_sales
            - task_key: silver_products
            - task_key: silver_stores
            - task_key: silver_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/10_gold_dim_product
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_dim_store
          description: "Gold Layer - Build Store Dimension"
          depends_on:
            - task_key: silver_sales
            - task_key: silver_products
            - task_key: silver_stores
            - task_key: silver_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/11_gold_dim_store
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_dim_promotion
          description: "Gold Layer - Build Promotion Dimension"
          depends_on:
            - task_key: silver_sales
            - task_key: silver_products
            - task_key: silver_stores
            - task_key: silver_promotions
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/12_gold_dim_promotion
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Gold Fact Table (after all dimensions complete)
        - task_key: gold_fact_sales
          description: "Gold Layer - Build Sales Fact Table"
          depends_on:
            - task_key: gold_dim_date
            - task_key: gold_dim_product
            - task_key: gold_dim_store
            - task_key: gold_dim_promotion
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/13_gold_fact_sales
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Analytics Views (after fact table)
        - task_key: gold_analytics_views
          description: "Gold Layer - Build Analytics Views"
          depends_on:
            - task_key: gold_fact_sales
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/14_gold_analytics_views
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
