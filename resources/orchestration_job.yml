# Orchestration Job - Triggers pipeline sequence
# Runs: Bronze Pipeline → Silver Pipeline → Gold Pipeline
resources:
  jobs:
    retail_analytics_orchestration:
      name: retail_analytics_orchestration
      description: "Master orchestration job: Bronze → Silver → Gold pipelines"

      # Daily schedule in production, paused in development
      trigger:
        periodic:
          interval: 1
          unit: DAYS

      tasks:
        # Task 1: Run Bronze Pipeline
        - task_key: bronze_pipeline_task
          description: "Run Bronze Pipeline - Ingest raw data from ADLS"
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_pipeline.id}

        # Task 2: Run Silver Pipeline (depends on Bronze)
        - task_key: silver_pipeline_task
          description: "Run Silver Pipeline - Validate and clean data"
          depends_on:
            - task_key: bronze_pipeline_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}

        # Task 3: Run Gold Pipeline (depends on Silver)
        - task_key: gold_pipeline_task
          description: "Run Gold Pipeline - Build Kimball star schema"
          depends_on:
            - task_key: silver_pipeline_task
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
