# Job definitions for the Retail Analytics Solution

resources:
  jobs:
    # Daily ETL Job
    daily_etl_job:
      name: daily_etl_job
      description: "Daily ETL pipeline for retail data processing"
      
      tasks:
        - task_key: ingest_raw_data
          notebook_task:
            notebook_path: ../src/notebooks/01_data_ingestion.py
            source: WORKSPACE
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
          libraries:
            - pypi:
                package: "pandas==2.0.3"
            - pypi:
                package: "pyspark==3.4.1"

        - task_key: transform_data
          depends_on:
            - task_key: ingest_raw_data
          notebook_task:
            notebook_path: ../src/notebooks/02_data_transformation.py
            source: WORKSPACE
          job_cluster_key: shared_cluster

        - task_key: create_aggregations
          depends_on:
            - task_key: transform_data
          notebook_task:
            notebook_path: ../src/notebooks/03_create_aggregations.py
            source: WORKSPACE
          job_cluster_key: shared_cluster

        - task_key: data_quality_checks
          depends_on:
            - task_key: create_aggregations
          notebook_task:
            notebook_path: ../src/notebooks/04_data_quality.py
            source: WORKSPACE
          job_cluster_key: shared_cluster

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            autoscale:
              min_workers: 2
              max_workers: 8

      email_notifications:
        on_failure:
          - ${var.notification_email}
        on_success:
          - ${var.notification_email}

      timeout_seconds: 3600
      max_retries: 2

    # Weekly Analytics Job
    weekly_analytics_job:
      name: weekly_analytics_job
      description: "Weekly analytics and reporting job"
      
      tasks:
        - task_key: generate_weekly_metrics
          notebook_task:
            notebook_path: ../src/notebooks/analytics/weekly_metrics.py
            source: WORKSPACE
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 4

      schedule:
        quartz_cron_expression: "0 0 8 ? * MON"
        timezone_id: "America/New_York"
        pause_status: "UNPAUSED"

      email_notifications:
        on_failure:
          - ${var.notification_email}

variables:
  notification_email:
    description: "Email for job notifications"
    default: "data-team@example.com"
