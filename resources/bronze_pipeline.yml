# Bronze Layer Pipeline - Raw data ingestion from ADLS
# Reads CSV files from ADLS once per run and merges into bronze schema tables
resources:
  pipelines:
    bronze_pipeline:
      name: retail_bronze_pipeline
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      libraries:
        - file:
            path: ../notebooks/01_bronze_sales.py
        - file:
            path: ../notebooks/02_bronze_products.py
        - file:
            path: ../notebooks/03_bronze_stores.py
        - file:
            path: ../notebooks/04_bronze_promotions.py
