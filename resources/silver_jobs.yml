# Silver Layer Jobs - Validate and clean data from bronze
resources:
  jobs:
    silver_sales:
      name: silver_sales
      description: "Validate and clean sales data from bronze into silver.sales"
      tasks:
        - task_key: silver_sales_task
          notebook_task:
            notebook_path: /Retail_Analytics_Solution/notebooks/05_silver_sales
            base_parameters:
              catalog: ${var.catalog}

    silver_products:
      name: silver_products
      description: "Validate and clean products data from bronze into silver.products"
      tasks:
        - task_key: silver_products_task
          notebook_task:
            notebook_path: /Retail_Analytics_Solution/notebooks/06_silver_products
            base_parameters:
              catalog: ${var.catalog}

    silver_stores:
      name: silver_stores
      description: "Validate and clean stores data from bronze into silver.stores"
      tasks:
        - task_key: silver_stores_task
          notebook_task:
            notebook_path: /Retail_Analytics_Solution/notebooks/07_silver_stores
            base_parameters:
              catalog: ${var.catalog}

    silver_promotions:
      name: silver_promotions
      description: "Validate and clean promotions data from bronze into silver.promotions"
      tasks:
        - task_key: silver_promotions_task
          notebook_task:
            notebook_path: /Retail_Analytics_Solution/notebooks/08_silver_promotions
            base_parameters:
              catalog: ${var.catalog}
