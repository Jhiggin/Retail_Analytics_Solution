# Delta Live Tables pipeline definitions

resources:
  pipelines:
    # Main DLT Pipeline
    retail_dlt_pipeline:
      name: retail_dlt_pipeline
      description: "Delta Live Tables pipeline for retail analytics"
      
      target: ${var.catalog_name}.${var.schema_name}
      
      libraries:
        - notebook:
            path: ../src/dlt/bronze_layer.py
        - notebook:
            path: ../src/dlt/silver_layer.py
        - notebook:
            path: ../src/dlt/gold_layer.py

      configuration:
        pipeline.environment: ${bundle.target}
        catalog: ${var.catalog_name}
        schema: ${var.schema_name}

      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 5
            mode: ENHANCED
          spark_conf:
            "spark.databricks.delta.preview.enabled": "true"
            "spark.databricks.delta.schema.autoMerge.enabled": "true"

      continuous: false
      channel: "CURRENT"
      edition: "ADVANCED"
      photon: true

      notifications:
        alerts:
          - "on-update-failure"
          - "on-flow-failure"
        email_recipients:
          - ${var.notification_email}

variables:
  catalog_name:
    description: "Unity Catalog name"
    default: "retail_analytics"
  schema_name:
    description: "Schema name"
    default: "analytics"
  notification_email:
    description: "Email for pipeline notifications"
    default: "data-team@example.com"
