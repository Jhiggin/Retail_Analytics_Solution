# Gold Layer Pipeline - Analytics and Kimball star schema
# Creates dimensions, fact table, and analytics views from silver layer data
resources:
  pipelines:
    gold_pipeline:
      name: retail_gold_pipeline
      catalog: ${var.catalog}
      schema: gold
      serverless: true
      libraries:
        - file:
            path: ../notebooks/09_gold_dim_date.py
        - file:
            path: ../notebooks/10_gold_dim_product.py
        - file:
            path: ../notebooks/11_gold_dim_store.py
        - file:
            path: ../notebooks/12_gold_dim_promotion.py
        - file:
            path: ../notebooks/13_gold_fact_sales.py
        - file:
            path: ../notebooks/14_gold_analytics_views.py
